<script>
    $(function () {
        var opportunity = new US.Opportunity.CandidateOpportunityDetail({"Id":"2e8f7ab5-f1b6-4255-98c3-91f08cec8457","Title":"Quality Engineering Lead, Quality, Non-Functional","Featured":true,"FullTime":true,"HoursPerWeek":null,"JobCategoryName":"*Information Technology","Locations":[{"Id":"237d97db-aeeb-514e-9c83-e15d79ffbac9","LocalizedName":"Vancity Centre","LocalizedLocationId":null,"LocalizedDescription":"Vancity Centre","Address":{"Line1":"183 Terminal Ave","Line2":null,"City":"Vancouver","State":{"Name":"British Columbia","Code":"BC"},"PostalCode":"V6A4G2","Country":{"Id":"38fc084a-38e3-454d-bde0-f0c067cf1356","Name":"Canada","Code":"CAN"}},"DisplayName":true,"DisplayLocationId":false,"DisplayDescription":false,"DisplayAddress":true,"DisplayStreetAddress":true,"Coordinates":{"Longitude":-123.100310171619,"Latitude":49.27287178642346},"Shapes":null,"SourceOfTruth":1,"IsAvailableForOpportunities":true},{"Id":"d831394f-9c5f-54c1-a316-2fc554691847","LocalizedName":"VCIB Office","LocalizedLocationId":"TOR01","LocalizedDescription":"Toronto","Address":{"Line1":"1800 - 200 King St West","Line2":null,"City":"Toronto","State":{"Name":"Ontario","Code":"ON"},"PostalCode":"M5H3T4","Country":{"Id":"38fc084a-38e3-454d-bde0-f0c067cf1356","Name":"Canada","Code":"CAN"}},"DisplayName":true,"DisplayLocationId":false,"DisplayDescription":false,"DisplayAddress":true,"DisplayStreetAddress":true,"Coordinates":{"Longitude":-79.38512592073653,"Latitude":43.647607513516604},"Shapes":null,"SourceOfTruth":1,"IsAvailableForOpportunities":true}],"PostedDate":"2026-08-26T19:58:08.918Z","UpdatedDate":"2026-09-24T18:24:45.01Z","RequisitionNumber":"ENGIN007738","Description":"\u003cp\u003e\u003cstrong\u003eOur Story \u0026amp; Purpose:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eWe\u0026rsquo;re Vancity, a member-owned credit union built on the principles of inclusion and social justice. Since 1946, our relentless commitment to these values has helped us challenge the status quo and break down barriers. We\u0026rsquo;ve made bold commitments to become net-zero by 2040 across all mortgages and loans, and we\u0026rsquo;re actively pursuing strategies in Indigenous banking and financial resilience for our members.\u003c/p\u003e\n\u003cp\u003eAs the largest private sector Living Wage Employer in Canada, we\u0026rsquo;re proud to be consistently recognized as one of the country\u0026rsquo;s Top Employers. If you\u0026rsquo;re ready to join our team of 2,300 diverse individuals, access competitive rewards and benefits, and be part of a greater movement \u0026ndash; apply today!\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eYour Role in Supporting Our Members:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eAs an\u0026nbsp;\u003cstrong\u003eEngineering Lead, Quality, Non-Functional\u003c/strong\u003e, you will play a senior technical role responsible for ensuring the quality engineering capabilities, performance, scalability, reliability, resilience, observability and operational readiness of member-facing platforms through hands-on engineering leadership and execution of automation-first practices across the SDLC. This position focuses on designing and implementing engineering solutions, leveraging deep technical expertise in automation, frameworks, tooling, AI-driven/agentic techniques, and non-functional validation. This is not a traditional QE Lead role. We are looking for a hands-on senior engineer (senior Performance SDET) to lead a team of test engineers in a dotted line capacity building scalable, code-driven quality solutions, not just manage testing activities.\u003c/p\u003e\n\u003cp\u003eThis is a\u0026nbsp;\u003cstrong\u003eFull-time, Permanent\u003c/strong\u003e\u0026nbsp;role based at\u003cstrong\u003e\u0026nbsp;Vancity head office\u003c/strong\u003e. Our head office is based in Vancouver, but we are open to candidates in \u003cstrong\u003eBC and Ontario.\u003c/strong\u003e While this position provides a hybrid work arrangement, you will be expected to be on-site for events and business demands when needed.\u0026nbsp;\u003cbr /\u003e\u003cbr /\u003e\u003cstrong\u003eHow You\u0027ll Make an Impact:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eQuality (Non-Functional) Strategy \u0026amp; Planning\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTranslating non-functional quality engineering strategy, standards and technical direction into executable plans and approaches aligned to business and delivery needs\u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eDesigning and implementing scalable, data-driven validation approaches that translate performance, resilience, availability and scalability objectives into measurable engineering initiatives\u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eDeveloping and contributing to engineering quality metrics (e.g. non-functional coverage, test reliability metrics, CI/CD feedback loops) through instrumentation and KPIs\u003c/li\u003e\n\u003cli\u003eImplementing and enforcing quality gates (coverage, performance thresholds, reliability criteria) within Dev-owned CI/CD pipelines\u003c/li\u003e\n\u003cli\u003eDeveloping enterprise approaches for generating representative performance and resilience-testing datasets and solutions, including synthetic data generation, masking and anonymization\u0026nbsp;\u003c/li\u003e\n\u003cli\u003ePartnering with engineering teams to improve monitoring, logging, tracing and telemetry capabilities using observability platforms for performance analysis and reliability validation\u003c/li\u003e\n\u003cli\u003eSupporting release-readiness reviews by validating non-functional quality requirements and operational risks\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eTechnical Leadership\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eProviding technical leadership as a senior individual contributor to the Quality Engineering team, operating as a \u0026ldquo;first among equals\u0026rdquo; within Performance SDET community\u003c/li\u003e\n\u003cli\u003eInfluencing, guiding and coaching Performance SDETs through hands-on collaboration in various areas including coding, design/engineering, analysis, etc.\u003c/li\u003e\n\u003cli\u003eLeading by example through hands-on design, framework development, coding and reviews, setting a high standard for the quality engineering craft on performance engineering, resilience validation and observability\u003c/li\u003e\n\u003cli\u003eInfluencing engineering decisions through technical credibility and sound business judgement, not formal authority\u003c/li\u003e\n\u003cli\u003eIdentifying risks and guiding teams through addressing complex performance, capacity and reliability challenges and execution leadership\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003ePerformance Engineering\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDesigning, building and evolving scalable performance testing frameworks and capabilities.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eEstablishing repeatable approaches for load, stress, endurance, spike, capacity and volume testing.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eDeveloping realistic workload-modelling strategies that represent member behavior, application usage patterns and transaction profiles.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eBuilding reusable tooling and pipelines that enable performance testing as part of continuous delivery.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eAnalyzing performance bottlenecks across applications, APIs, databases, integrations and infrastructure layers.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003ePartnering with engineering teams to define performance SLAs, SLOs and system-capacity targets.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eExploring and implementing AI-assisted and agentic testing approaches to improve coverage, speed, and maintainability of our Performance test framework\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eResilience \u0026amp; Reliability Engineering\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLeading resilience-testing initiatives for critical member-facing and enterprise platforms by defining and implementing fault-injection, failure-simulation and chaos-engineering practices.\u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eValidating disaster recovery, failover, high availability and business-continuity capabilities\u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003ePartnering with Engineering teams to improve operational resilience and establish resilience-validation standards for cloud-native and distributed architectures\u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eSupporting incident post-mortems and root-cause analysis activities, translating learnings into engineering practices and automated validation\u0026nbsp;\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eQuality Advocacy\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ePartnering with engineering leadership to improve organizational maturity in quality engineering and site reliability practices.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eCollaborating directly with product and engineering partner teams to ensure non-functional requirements are defined, measurable and validated\u003c/li\u003e\n\u003cli\u003eConducting engineering analysis to identify root causes of performance and reliability issues\u003c/li\u003e\n\u003cli\u003eBeing the Dev teams\u0026rsquo; quality advocate, promoting shift-left performance and reliability engineering practices\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eHands-On Engineering\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eDesigning and developing automation frameworks, tooling and utilities supporting non-functional quality engineering\u003c/li\u003e\n\u003cli\u003eBuilding integrations that embed performance and resilience validation into CI/CD pipelines\u003c/li\u003e\n\u003cli\u003eDeveloping reusable quality-engineering capabilities that can be adopted across engineering teams\u003c/li\u003e\n\u003cli\u003eEvaluating and implementing emerging technologies, including AI-assisted testing and intelligent quality-engineering techniques, to improve efficiency and effectiveness\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eWhat You\u0026rsquo;ll Bring to the Team:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e10+ years of experience in software engineering, performance engineering, site reliability engineering, quality engineering, or related field\u003c/li\u003e\n\u003cli\u003eExtensive experience leading enterprise-scale non-functional testing initiatives operating as a senior technical contributor or Performance SDET\u003c/li\u003e\n\u003cli\u003eDeep expertise in performance-engineering methodologies, workload modelling, capacity planning and scalability testing.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eHands-on experience designing and evolving performance-testing frameworks using tools such as k6, Gatling, JMeter, Locust, NeoLoad or equivalent.\u003c/li\u003e\n\u003cli\u003eExperience implementing resilience and chaos-engineering practices using tools such as Gremlin, Chaos Toolkit, Azure Chaos Studio or equivalent.\u003c/li\u003e\n\u003cli\u003eStrong understanding of API architectures, microservices, distributed systems, event-driven architectures and on-premise or cloud-native applications.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003eStrong programming skills (Python, JavaScript, C#, Java)\u003c/li\u003e\n\u003cli\u003eProven experience designing and building and evolving performance testing frameworks (not just using them)\u003c/li\u003e\n\u003cli\u003eExperience with AI-powered testing or test generation: LLMs, agentic and spec-driven automation\u003c/li\u003e\n\u003cli\u003eExperience with CI/CD platforms including GitHub Actions, Azure DevOps, Jenkins or GitLab CI\u003c/li\u003e\n\u003cli\u003eFamiliarity with containerization and orchestration technologies, AWS or Azure, containers (Docker/Kubernetes)\u003c/li\u003e\n\u003cli\u003eStrong understanding of database-performance concepts across relational and NoSQL technologies.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cul\u003e\n\u003cli\u003eExperience with observability and monitoring platforms such as Dynatrace, Splunk, Grafana, Prometheus, Azure Monitor or equivalent.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cbr /\u003eYou\u0026rsquo;ll Thrive Here If You Are:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eEngineering-minded\u003c/strong\u003e\u0026nbsp;\u0026ndash; Treating testing as a software engineering discipline.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCollaborative\u003c/strong\u003e\u0026nbsp;\u0026ndash; Influencing teams and building alignment without formal authority.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eAnalytical\u003c/strong\u003e\u0026nbsp;\u0026ndash; Solving complex technical problems in ambiguous environments.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eInnovative\u003c/strong\u003e \u0026ndash; Exploring AI-driven automation and modern engineering practices\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eWe value lived experience, so if you are interested in this role, we encourage you to apply even if you feel your skills don\u0027t perfectly align with those listed.\u003cbr /\u003e\u003cbr /\u003e\u003c/em\u003e\u003cstrong\u003eWhat You\u0026rsquo;ll Earn:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eThis role offers a salary range of \u003cstrong\u003e$113,000 to $153,000\u003c/strong\u003e per annum. The base pay offered may vary depending on factors such as relevant qualifications, skills, previous experience, and internal equity. As part of our total rewards package, employees may also be eligible for our annual incentive program, subject to program eligibility requirements.\u003cbr /\u003e\u003cbr /\u003e\u003cstrong\u003eWhy You\u0026rsquo;ll Love Working Here:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eA career at Vancity is more than just a job, you\u0026rsquo;re joining a tradition of change-makers who are creating lasting change for our communities. Beyond base pay, we offer a comprehensive total rewards package to ensure our employees are empowered to thrive:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eLiving Wage Employer:\u003c/strong\u003e We\u0026rsquo;re the largest private-sector Living Wage Employer in Canada and consistently ranked among Canada\u0026rsquo;s Top Employers\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCustomizable Benefits:\u003c/strong\u003e Permanent employees receive flexible benefit packages that can be tailored annually to meet evolving needs\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGenerous Vacation:\u003c/strong\u003e New employees start with 3-4 weeks of vacation per year, with additional days earned over time\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eExtra Stat Holidays:\u003c/strong\u003e In addition to BC\u0026rsquo;s 11 statutory holidays, we offer 2 extra days, plus care days for personal or family illness\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eImmediate Health Coverage:\u003c/strong\u003e Health and dental benefits begin on your hire date, with three levels of coverage to choose from\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDefined Benefit Pension:\u003c/strong\u003e Our retirement plan provides a guaranteed income for life, recognizing that retirement looks different for everyone\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003e\u003cbr /\u003eVancity Talent Programs:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eVancity supports an inclusive hiring process for candidates who self-identify as Indigenous, Black, or Trans. With special permission from the BC Human Rights Commissioner, this initiative provides access to career development opportunities, prioritized job screening, and feedback. Any information you choose to share will be stored securely and used only for recruitment and career development connected to this initiative, in line with the BC Personal Information Protection Act (PIPA). For details, please see our dedicated Talent Programs job posting.\u003c/p\u003e\n\u003cp\u003eThis role is an open vacancy, and our hiring process is grounded in fairness, transparency, and inclusion. We are committed to an inclusive, barrier-free and accessible recruitment experience for all candidates. If you require any accommodations or support at any stage of the recruitment process (including the application stage), we encourage you to let us know by contacting our Talent Acquisition team at recruitment@vancity.com. We\u0026rsquo;re here to work with you to ensure your needs are met promptly and effectively. All requests will be handled with the utmost respect and confidentiality, so you can participate fully in the process.\u003c/p\u003e","EqualOpportunityEmployerDescription":null,"PayTransparencyPolicyStatement":null,"MatchScore":1.0,"HasApplied":false,"ApplicationJobBoardName":null,"ApplicationJobBoardId":null,"DateApplied":null,"Salaried":true,"CompensationAmount":null,"PublishingStatus":1,"Links":[],"BehaviorCriteria":[],"MotivationCriteria":[],"EducationCriteria":[],"LicenseAndCertificationCriteria":[],"SkillCriteria":[],"WorkExperienceCriteria":[],"JobBoardMemberships":[{"JobBoardId":"a46cbdaa-ca2c-49b6-8d2b-e0ceaafa0e25","PublishedInternal":false,"PublishedExternal":true,"ExternalPostedDate":"2026-10-14T22:40:03.49Z","InternalPostedDate":null},{"JobBoardId":"5affd992-c00c-4c16-aa7f-2e54018cf31e","PublishedInternal":true,"PublishedExternal":false,"ExternalPostedDate":null,"InternalPostedDate":"2026-10-14T22:40:03.49Z"}],"Ass     <script>
        function escapeHtml(text) {
            if (text == null) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('showBanner') === 'true') {
                const banner = document.getElementById('Successbanner');
                const bannerMessage = escapeHtml($.t("Common.QuickApply.SuccessBannerMessage"));
                const bannerAction = escapeHtml($.t("Layout.AccessibilityBanner.DismissMessage"));
                if (banner) {
                    var ugkBanner = document.createElement('ukg-banner');
                    ugkBanner.setAttribute('inline', '');
                    ugkBanner.setAttribute('type', 'success');
                    ugkBanner.textContent = bannerMessage;

                    var endDiv = document.createElement('div');
                    endDiv.setAttribute('slot', 'end');

                    var ugkButton = document.createElement('ukg-button');
                    ugkButton.setAttribute('aria-label', 'banner-action');
                    ugkButton.setAttribute('emphasis', 'low');
                    ugkButton.textContent = bannerAction;
                    ugkButton.addEventListener('click', dismissBanner);

                    endDiv.appendChild(ugkButton);
                    ugkBanner.appendChild(endDiv);

                    banner.innerHTML = '';
                    banner.appendChild(ugkBanner);
                    banner.style.display = 'block';
                }
            }
        });
        function dismissBanner() {
            const banner = document.getElementById('Successbanner');
            if (banner) {
                banner.style.display = 'none';
            }
        }
        </script>
    <script>
            $(function () {
                // Clears out Matchinator session data
                $("#LogOutButton").click(function () {
                    US.utils.localStorage.removeItem('personalizedSearchProfile');
                    return true;
                });

                $("#skipLink").click(function () {
                    SkipToMainContent();

                });

                $("#skipLink").keyup(function (e) {
                    if (e.keyCode == 13) {
                        SkipToMainContent();
                    }
                });

                function SkipToMainContent() {
                    var ele = $("#PageContainer");
                    if (ele.length > 0) {
                        var scrollTopValue = ele.offset().top;
                        // Toggle-aware scroll value: sanitize when security fix is enabled
                        var scrollValue = true
                            ? Math.floor(Math.max(0, scrollTopValue))  // Security ON: sanitize (safe integer, non-negative)
                            : scrollTopValue;                          // Security OFF: original (backward compatible)

                        $('html, body').animate({
                            scrollTop: scrollValue
                        });

                        var headingEle = ele.find('h1:first, h2:first').eq(0);
                        var focusableElement;
                        if (headingEle.length > 0) {
                            focusableElement = headingEle;
                        } else {
                            focusableElement = ele;
                        }
                        focusableElement.attr("tabindex", "-1").css("outline", "none").focus();

                        return false;
                    }
                }

                $(window).resize(function () {
                    if ($(window).width() <= 767) {
                        $(".nav-pills.nav-responsive").addClass("nav-stacked");
                    } else {
                        $(".nav-pills.nav-responsive").removeClass("nav-stacked");
                    }
                });
                $(window).resize();
            });
        </script>
