"description" : "<p style=\"text-align: justify;\"><span style=\"font-family: Arial , Helvetica , sans-serif;font-size: 17.0px;\">Our Finance department is actively hiring a Clerk - Data Entry Operator to assist with various clerical functions related to the enterprise system payroll module. Join a team of individuals who love what they do and begin your municipal career today! Typical duties in this role include data entry from documents such as timecards, clerical duties such as dividing material to be entered into batches; adding up and totaling specified information such as number of transactions, hours, and records per batch for completion of batch headers; balancing batches by comparing batch totals to input totals; and maintaining Time Input-Control Documents. The Clerk – Data Entry Operator is also responsible for checking for accuracy, correcting irregularities, and assisting internal contacts with questions related to payroll matters. Performs related work as required.</span><br /><br /><span style=\"font-family: Arial , Helvetica , sans-serif;font-size: 17.0px;\">Qualifications include completion of Grade 12 supplemented by typing and commercial courses or training in computer data entry procedures and equipment, plus some related experience or an equivalent combination of training and experience. The ideal candidate will have the ability to perform clerical work and rapid data entry, with a keen eye for accuracy in their work. This position requires knowledge of departmental functions related to payroll, along with knowledge of the enterprise system payroll module. Great customer service skills are an asset, along with the ability to complete arithmetic calculations and perform repetitious work under time constraints. Skill in the use of equipment related to the role is also required.</span><br /><br /><span style=\"font-family: Arial , Helvetica , sans-serif;font-size: 17.0px;\"><strong>Pay Rate: </strong>$30.39 per hour + 12% in lieu of benefits</span><br /><br /><span style=\"font-family: Arial , Helvetica , sans-serif;font-size: 17.0px;\"><strong>Location: </strong>West Building</span><br /><br /><span style=\"font-family: Arial , Helvetica , sans-serif;font-size: 17.0px;\"><strong>Hours of work: </strong>This is an auxiliary position, hours and shifts are based on operational requirements and do not provide guaranteed hours of work, which may include on-call shifts. Typical shifts are 2 to 3 days a week, Monday to Friday, 9 am to 4:45 pm.</span><br /><br /><span style=\"font-family: Arial , Helvetica , sans-serif;font-size: 17.0px;\">Please apply online at www.burnaby.ca/careers by <strong>October 26, 2026.</strong></span><br /><br /><span style=\"font-family: Arial , Helvetica , sans-serif;font-size: 17.0px;\"><i>Copies of relevant professional certificates, degrees, or tickets will be required at the time of the interview. Please contact People and Culture at <strong>604-294-7303</strong> if you do not receive a confirmation email within one hour of submitting your application online at www.burnaby.ca/careers. We thank all applicants for their interest; however, only those considered for an interview will be contacted.</i></span><br /><br /><span style=\"font-family: Arial , Helvetica , sans-serif;font-size: 17.0px;\"><i>We respectfully acknowledge that the City of Burnaby is located on the unceded territories of the xʷməθkʷəy̓əm (Musqueam), Sḵwx̱wú7mesh (Squamish), səlilwətaɬ (Tsleil-Waututh), and kʷikʷəƛ̓əm Peoples (Kwikwetlem). Each Nation has distinct histories and distinct traditional territories that fully or partially encompass the city. We encourage you to learn more about the Host Nations whose ancestors have occupied and used these lands, including parts of present-day Burnaby, for thousands of years. We are grateful to be on this territory as we dedicate ourselves to creating an inclusive and diverse workforce that reflects our vibrant community and welcomes applicants of all backgrounds, genders,
