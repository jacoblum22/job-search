 interpretations, analyses, and test/summary reports as required.<\/p>\n<h2>What You Bring<\/h2>\n<p><strong>Education, Training and Experience<\/strong>Completion of a recognized Cardiology Technology Program at the Diploma level.Successful completion of the Canadian Society of Cardiology Technologists (CSCT) exam or successful completion of the CSCT exam within one (1) year of hire date.Plus, one of the following:Graduation from a recognized pacemaker program (such as the BCIT advanced certificate in Cardiac Sciences \u2013 Cardiac Rhythm Device Technology); orSuccessful completion of the International Board of Heart Rhythm Exam (IBHRE) Certified Cardiac Device Specialist (CCDS) exam; orTwo years\u2019 recent related experience and equivalent combination of education, training, and experience.<strong>Skills and Abilities<\/strong>\u2022 Demonstrated knowledge of current relevant techniques, methods, and procedures.\u2022 Demonstrated ability to integrate and evaluate pertinent data (from multiple sources) and to problem-solve and make decisions effectively.\u2022 Demonstrated ability to integrate best practice and current research evidence to support professional practice decisions and actions.\u2022 Demonstrated ability to communicate and deal effectively with patients/residents, families, staff, and other health care providers both verbally and in writing.\u2022 Demonstrated ability to work independently, manage competing priorities, prioritize workload, and complete assigned work.\u2022 Demonstrated initiative and self-starter.\u2022 Ability to demonstrate and explain procedures to other employees and students.\u2022 Demonstrated ability to work collaboratively as a member of a team and to offer and seek advice as necessary.\u2022 Demonstrated ability to operate equipment, including computerized systems.\u2022 Knowledge of other health care disciplines and their role in health care.\u2022 Physical ability to carry out the duties of the position.<\/p>\n<h2>What We Offer<\/h2>\n<ul>\n <li><strong>A competitive salary:<\/strong> The rate for this position is $40.26 to $50.29per hour.<\/li>\n <li><strong>Meaningful impact<\/strong>: Your dedication and expertise will directly impact the lives of individuals struggling with heart conditions.<\/li>\n <li><strong>Growth opportunities:<\/strong> We welcome individuals at all stages of their career, offering opportunities for professional development and growth.<\/li>\n <li><strong>State-of-the-art facilities:<\/strong> &nbsp;The new St. Paul\u2019s Hospital and health campus will be the most innovative approach to the delivery of integrated care in B.C. and Canada, designed to appropriately address the future health needs of patients, families and our communities. From hospital care to primary and community health solutions, the new St. Paul\u2019s Hospital and health campus will continue to lead innovations in care, research, and teaching. The new St. Paul\u2019s Hospital is expected to open in 2027.<\/li>\n <li><strong>Inclusive culture<\/strong>: We respect the diversity, dignity and interdependence of all persons. We value the cultural richness that our diverse workforce brings to the care of our equally diverse population of patients and residents.<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p><\/p>\n<p><strong>Your Day-to-Day:<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>1. Facilitates optimal clinical effectiveness of arrhythmia management of CIED through the application of technical knowledge and skills to evaluate and manage device function.2. Performs a variety of tests such as determining capture and sensing thresholds of implanted leads, device and lead integrity and safety, and making mathematical calculations to determine optimum safety values of arrhythmia devices, in order to assess device function. Provides urgent and/or unplanned arrhythmia management related to device services (including interrogation analysis and programming changes) to various areas of the hospital including acute care, critical care, operating rooms (OR) and Radiology department.3. As required, performs arrhythmia device analyses and programming in the OR or Cardiac Procedure Room, including assisting the physician during implant procedures, and setting individual device to correct values during or post implant.4. Assists with other arrhythmia device and implant duties in the clinic, OR and Cardiac Procedure Room related to patient care under the direction of the RN and in collaboration with the team.5. As part of the follow-up care and patient management, performs device analysis for cardiac implantable electronic device (CIED) patients, including interrogation and programming.6. Participates in the care, management, and follow-up of remote monitoring transmissions as well as arrhythmia device advisories and recalls in collaboration with the team and as per organizational policy.7. Reviews and maintains records relevant to patient history, vital signs, and device details.8. Responds to queries from various internal and external sources regarding device functions and their manifestation in patients and various recordings.9. Participates in the development and review of standards, procedures, and educational material relevant to the Heart Rhythm program. Collaborates with the team on educational initiatives for patients and staff.10. Participates in the review, evaluation, and selection of devices, leads and accessories and provides implant recommendations.11. Obtains appropriate approvals for new equipment orders and works with Purchasing to process timely order and receipt of equipment using a variety of tools such as checklists, cardio lab and EPRO ordering system. Ensures older equipment is used before new equipment is used and/or ordered. Keeps equipment storage organized with clear labels to identify expiry dates.12. Acts as a resource to physicians and other health providers relevant to device functions by providing information, demonstrating appropriate use of equipment, and troubleshooting device functions. Advises the relevant supervisor in a timely manner of misuse of equipment.13. Ensures equipment for scheduled procedure is available and that all equipment within the area of assigned responsibility is operating within the limits of quality control. Notifies operators of equipment problems or malfunctions and works with colleagues to find solutions. Collaborates with Biomedical Engineering and/or manufacturer as required.14. Maintains equipment by cleaning, lubricating, and replacing items such as paper rolls, electrodes, and leads.15. Works closely with the Porter/Ward Aide to ensure adequate levels of stock in the labs and storage areas and that appropriate approvals have been obtained prior to increasing PAR levels.16. Performs the duties of a Cardiology Technologist as required, including a variety of tests such as stress testing, Holter and event monitors including analysis and electrocardiograms.17. Explains cardiac device screen system to patients, monitors cardiac devices and notifies cardiologist of abnormalities; contacts patients by telephone for repeat recordings as required. Notifies appropriate health care provider of any abnormalities according to established policies and procedures.18. Transfers and assigns ECGs in ECG Cardiology Management systems (i.e. Tracemaster) for interpretation by medical staff. Follows organizational policy related to documentation and recording of all device analysis and programming changes in the clinic and acute care settings.19. Monitors ongoing departmental activity levels and assists fellow staff to meet requests for service and in meeting the team patient care benchmarks by identifying possible service gaps.20. Documents information including patient assessment, device interrogation, analysis, and programming changes as per organizational policy.21. Participates in research projects and quality improvement initiatives as required.22. Participates in the instruction/orientation of staff and/or students by assisting with departmental orientations, in-service presentations, demonstrating procedures and answering questions, as required.23. Performs other related duties as assigned.<\/p>","directApply":true,"title":"Cardiac Rhythm Technologist","@context":"http://schema.org","url":"https://careers-phc.icims.com/jobs/65340/cardiac-rhythm-technologist/job","hiringOrganization":{"@type":"Organization","name":"Providence Healthcare","sameAs":"https://www.providencehealthcare.org/"},"jobLocation":[{"address":{"addressCountry":"CA","streetAddress":"1081 Burrard St.","@type":"PostalAddress","postalCode":"V6Z1Y6","addressLocality":"Vancouver","addressRegion":"BC","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"datePosted":"2026-09-09T04:00:00.000Z","occupationalCategory":"Technologists"}</script>
