# Job search aggregator configuration

# ─── Shared job search (applies to every source) ────────────────────
# Adzuna/CareerJet are queried with canonical phrases, aliases (HR intern,
# event coordinator, …), and level terms. Workday and email alerts return
# unfiltered postings; titles *or* descriptions must match the same phrase
# table. All sources then drop senior titles, max_years_experience, and
# on-site jobs outside Metro Vancouver (remote Canada and remote US are kept).
#
# `location` is the primary geo for API search. `remote_sweep_location` is a
# second pass that only keeps postings classified as remote — so a Vancouver
# search does not miss Ottawa-tagged WFH roles, and a Canada search does not
# flood Toronto on-site jobs into the DB.

search:
  location: "Vancouver, BC"
  remote_sweep_location: "Canada"
  require_relevant_location: true
  # Target: entry-level data science / data analyst / BI / ML / software roles.
  keywords:
    - "Data Scientist"
    - "Data Analyst"
    - "Data Science"
    - "Machine Learning"
    - "Business Intelligence"
    - "Analytics"
    - "Data Engineer"
    - "Software Engineer"
    - "Software Developer"
    - "Python Developer"
  level_terms:          # API queries: early-career levels (not internships)
    - "junior"
    - "entry level"
    - "new grad"
    - "associate"
  # Extra title phrases per keyword (merged with DEFAULT_ALIASES in search_match.py)
  keyword_aliases:
    "Data Scientist":
      - "associate data scientist"
      - "junior data scientist"
      - "data science analyst"
      - "applied scientist"
      - "decision scientist"
    "Data Analyst":
      - "data analytics"
      - "analytics analyst"
      - "reporting analyst"
      - "insights analyst"
      - "bi analyst"
      - "product analyst"
      - "marketing analyst"
      - "quantitative analyst"
      - "junior analyst"
      - "research analyst"
      - "data specialist"
    "Machine Learning":
      - "ml engineer"
      - "machine learning engineer"
      - "ai engineer"
      - "mlops"
      - "nlp engineer"
      - "computer vision"
      - "ai developer"
    "Business Intelligence":
      - "bi developer"
      - "power bi"
      - "tableau developer"
      - "looker"
    "Analytics":
      - "analytics engineer"
      - "analytics developer"
      - "growth analyst"
      - "customer analytics"
    "Software Engineer":
      - "software developer"
      - "full stack"
      - "full-stack"
      - "backend developer"
      - "back-end developer"
      - "programmer analyst"
      - "new grad software"
  # Replaces PRIORITY_API_QUERIES in search_match.py (those are HR/events-focused)
  extra_api_queries:
    - "junior data scientist"
    - "associate data scientist"
    - "junior data analyst"
    - "entry level data analyst"
    - "business intelligence analyst"
    - "BI analyst"
    - "reporting analyst"
    - "product analyst"
    - "analytics engineer"
    - "machine learning engineer junior"
    - "junior python developer"
    - "new grad software engineer"
    - "SQL analyst"
    - "Looker analyst"
    - "BigQuery"
  # Never store or fetch jobs from these companies (matched as whole words
  # in the company name). AlgaeCal: Jake's past employer.
  exclude_companies:
    - "AlgaeCal"
  exclude_title_terms:
    # Co-ops need current enrollment; Jake graduated May 2026. Internships
    # are kept (score penalty only).
    - "co-op"
    - "coop"
    - "senior"
    - "sr"
    - "director"
    - "manager"
    - "lead"
    - "principal"
    - "vice president"
    - "vice-president"
    - "vp"
    - "head"
    - "chief"
    - "ux"
    - "ui/ux"
    - "user experience"
    - "staff"
    - "architect"
    - "trainer"     # AI-trainer / annotation gigs
    - "annotator"
    - "tutor"
  # Deliberately broad: a snippet-only listing (Adzuna, CareerJet, alert
  # emails) whose title has any of these words gets its full posting fetched,
  # and the full text then goes through the normal keyword filter. A title
  # with none of them (and no early-career word) isn't stored at all. The
  # exclude_title_terms above still apply.
  fetch_title_terms:
    - "data"
    - "database"
    - "analytics"
    - "analyst"
    - "analysis"
    - "insights"
    - "reporting"
    - "business intelligence"
    - "bi"
    - "machine learning"
    - "ml"
    - "ai"
    - "artificial intelligence"
    - "deep learning"
    - "nlp"
    - "computer vision"
    - "statistics"
    - "statistical"
    - "statistician"
    - "quantitative"
    - "research"
    - "scientist"
    - "science"
    - "modeling"
    - "modelling"
    - "forecasting"
    - "software"
    - "developer"
    - "programmer"
    - "engineer"
    - "python"
    - "sql"
    - "automation"
    - "informatics"
    - "computational"
    - "technology"
    - "technical"
  # A job whose full posting we have (ATS boards, Workday, fetched listings)
  # is kept if its title has any fetch_title_terms word, or its description
  # names at least core_skills_min of these, instead of needing a target
  # title phrase. Hard drops (exclude_title_terms, years, location,
  # companies) still apply; the score decides how good it is.
  full_description_chars: 1000
  core_skills_min: 2
  core_skills:
    - "python"
    - "sql"
    - "pandas"
    - "numpy"
    - "scikit-learn"
    - "pytorch"
    - "tensorflow"
    - "machine learning"
    - "bigquery"
    - "snowflake"
    - "dbt"
    - "tableau"
    - "power bi"
    - "looker"
    - "git"
    - "docker"
    - "javascript"
    - "typescript"
  # Stored up to 5 years; 3-5 is a score penalty, not a drop (see score: below).
  max_years_experience: 5

# ─── API job-board aggregators (Adzuna, CareerJet) ─────────────────
# Each keyword is run as a separate search query per API, per location.
# Credentials come from .env (see .env.example) — never put keys here.

api_sources:
  results_per_page: 50
  max_pages: 3
  adzuna:
    enabled: true
    country: "ca"  # Adzuna country code
  careerjet:
    enabled: true
    locale_code: "en_CA"
    referer: "https://jacoblum.com"  # must match the site registered on the publisher dashboard

# ─── Email-alert sources (LinkedIn/Indeed/Glassdoor via Gmail) ────────
# Job-alert emails are forwarded from an Outlook inbox to Gmail. Outlook's
# "Forward" rule rewrites the envelope sender to the forwarding mailbox, so
# adapters can't identify the source by From header alone — set
# forward_from to that forwarding mailbox and each adapter additionally
# matches on content (original sender name/domain still appears in the
# forwarded body). Leave blank if alerts land in Gmail directly (no
# forwarding), in which case adapters fall back to matching the original
# sender's From header only.

email_sources:
  forward_from: ""

# ─── Workday Sources ────────────────────────────────────────────────
# Each entry defines a Workday job board to scrape.
# The API pattern is: https://{tenant}.{wd}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs
#
# Set enabled: false to skip a source without removing it.

sources:
  - name: "UBC"
    tenant: "ubc"
    wd: "wd10"
    site: "ubcstaffjobs"
    enabled: true

  - name: "City of Vancouver"
    tenant: "cityofvancouver"
    wd: "wd5"
    site: "COV"
    enabled: true

  - name: "TRIUMF"
    tenant: "triumf"
    wd: "wd10"
    site: "careers-at-triumf-job-postings"
    enabled: true

  - name: "BCI"
    tenant: "bci"
    wd: "wd10"
    site: "BCI_Careers"
    enabled: false  # All jobs in Victoria — enable if they post Vancouver roles

  - name: "BCAA"
    tenant: "bcaa"
    wd: "wd3"
    site: "bcaacareers"
    enabled: true

  # ── New Vancouver-area sources (discovered via API probing) ──

  - name: "STEMCELL Technologies"
    tenant: "stemcell"
    wd: "wd3"
    site: "External_Careers"
    enabled: true
    location_filter:   # OR match — job passes if location contains ANY of these
      - "Vancouver"
      - "Burnaby"
      - "Greater Vancouver"

  - name: "Workday"
    tenant: "workday"
    wd: "wd5"
    site: "Workday"
    enabled: true
    location_filter: "Vancouver"  # ~411 total, ~7 in Vancouver

  - name: "RBC"
    tenant: "rbc"
    wd: "wd3"
    site: "RBCGLOBAL1"
    enabled: true
    location_filter:
      - "Vancouver"
      - "Burnaby"

  - name: "CIBC"
    tenant: "cibc"
    wd: "wd3"
    site: "search"
    enabled: true
    location_filter:
      - "Vancouver"
      - "Burnaby"
      - "Richmond, BC"  # avoid Richmond Hill, ON

  - name: "BDO Canada"
    tenant: "bdo"
    wd: "wd3"
    site: "BDO"
    enabled: true
    location_filter: "Vancouver"

  # ── Disabled sources ──

  - name: "Salesforce"
    tenant: "salesforce"
    wd: "wd12"
    site: "External_Career_Site"
    enabled: false  # Zero Vancouver jobs currently
    location_filter: "Vancouver"

  - name: "Autodesk"
    tenant: "autodesk"
    wd: "wd1"
    site: "Ext"
    enabled: false  # ~600 jobs globally
    location_filter: "Vancouver"

  - name: "NVIDIA"
    tenant: "nvidia"
    wd: "wd5"
    site: "NVIDIAExternalCareerSite"
    enabled: false  # ~2000 jobs globally, zero in Canada
    location_filter: "Vancouver"

  - name: "Canadian Tire"
    tenant: "canadiantirecorporation"
    wd: "wd3"
    site: "Enterprise_External_Careers_Site"
    enabled: false  # ~4 Vancouver jobs
    location_filter: "Vancouver"

  - name: "TELUS Health"
    tenant: "lifeworks"
    wd: "wd3"
    site: "External"
    enabled: false  # Only 1 Vancouver job
    location_filter: "Vancouver"

# ─── Fit score (src/score.py) ──────────────────────────────────────
# Points system run over every job in jobs.db on each aggregator run, before
# the dashboard is built. The dashboard shows the score, its tier, and the
# reasons. Edit weights here and re-run `python scripts/rescore.py` to see the
# effect without scraping.

score:
  # Hard skips (tier "skip", no score)
  skip_years_over: 5          # more than 5 years required
  skip_other_locations: true  # not Vancouver-area or remote
  skip_title_terms:
    - "senior"
    - "sr."
    - "sr"
    - "staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "head of"
    - "vice president"
    - "architect"
    - "account executive"
    - "administrative assistant"
    - "event coordinator"
    - "pathologists' assistant"
    - "nurse"
    - "embedded"
    - "firmware"
    - "trainer"
    - "annotator"
    - "tutor"
  # Wrong-field words: skip, unless the title is also a core data role
  # (a family with overrides_field_skip), e.g. "Data Scientist, Sales"
  field_skip_terms:
    - "business development"
    - "talent acquisition"
    - "recruiter"
    - "recruitment"
    - "human resources"
    - "hr"
    - "people & culture"
    - "customer service"
    - "sales"
  # Jake graduated May 2026, so student-only roles are out, unless the
  # title also says new grad ("Student / New Grad Positions"). Internships
  # aren't skipped, just penalized (internship_penalty below).
  student_title_terms:
    - "co-op"
    - "coop"
    - "student"
    - "undergraduate"
    - "practicum"
    - "work term"
  new_grad_title_terms: ["new grad", "new graduate", "recent graduate"]
  internship_penalty: {points: -15, keywords: ["intern", "internship"]}
  # Regexes over the description; any hit = skip (remote US that needs US
  # residence, or a required PhD)
  skip_description_patterns:
    - "must (?:reside|live|be located|be based) (?:in|within) the (?:U\\.?S\\.?A?\\.?|United States)"
    - "(?:U\\.?S\\.?|United States)[- ]based (?:candidates|applicants) only"
    - "only (?:considering|accepting) (?:candidates|applicants) (?:located|residing|based) in the (?:U\\.?S\\.?|United States)"
    - "(?:reside|located|live) in (?:one of )?the following (?:U\\.?S\\.? )?states"
    # PhD required (not "Master's or PhD", "PhD preferred", "pursuing a PhD")
    - "(?:must|required to) (?:hold|have|possess) (?:an? )?(?:MD and/or )?Ph\\.?\\s?D"
    - "Ph\\.?\\s?D\\.?(?: degree)? (?:is )?required"
  # Jake has a Bachelor's. A Master's the posting requires (no "preferred",
  # no "or equivalent experience", and no Bachelor's accepted anywhere) is a
  # skip; any other Master's ask (preferred, an asset, one of several
  # options) costs optional_points. "Bachelor's or Master's" costs nothing.
  masters:
    required_skip: true
    optional_points: -10

  # Title family: only the best-matching family counts
  title_families:
    - name: "data science"
      overrides_field_skip: true
      points: 22
      keywords: ["data scientist", "data science", "decision scientist", "applied scientist", "machine learning scientist"]
    - name: "data analyst"
      overrides_field_skip: true
      points: 22
      keywords: ["data analyst", "data analytics", "analytics analyst", "bi analyst", "business intelligence", "reporting analyst", "insights analyst", "product analyst", "analytics engineer", "sql analyst", "marketing analyst", "growth analyst", "customer analytics", "quantitative analyst", "data specialist", "business analytics", "analytics specialist", "analytics developer"]
    - name: "ML / AI"
      overrides_field_skip: true
      points: 20
      keywords: ["machine learning", "ml engineer", "ai engineer", "ai developer", "mlops", "nlp", "llm", "computer vision", "applied ai"]
    - name: "data engineering"
      overrides_field_skip: true
      points: 15
      keywords: ["data engineer", "etl developer", "bi developer", "bi engineer", "business intel engineer"]
    - name: "software"
      points: 12
      keywords: ["software engineer", "software engineering", "software developer", "software development engineer", "python developer", "backend developer", "back-end developer", "full stack", "full-stack", "programmer analyst", "web developer"]
    # Bare "analytics" in a title that no family above names
    # ("Coordinator, Quality Improvement & Analytics", "Product Analytics Consultant")
    - name: "analytics"
      points: 18
      keywords: ["analytics"]
    - name: "general analyst"
      points: 10
      keywords: ["business analyst", "research analyst", "analyst"]
    # Any other technical title (Integration Engineer, Quantitative Developer),
    # only when the posting names at least 2 skills Jake has
    - name: "technical"
      points: 10
      min_skill_hits: 2
      keywords: ["engineer", "developer", "programmer", "quantitative", "integration", "technical"]

  entry_level:
    title_points: 15
    title_keywords: ["junior", "jr.", "jr", "entry level", "entry-level", "new grad", "new graduate", "graduate", "associate", "level i", "level 1", "i"]
    description_points: 8
    description_keywords: ["new grad", "new graduate", "recent graduate", "recent graduates", "entry-level", "entry level", "early career", "early-career", "0-2 years", "0–2 years", "1-2 years", "1+ years", "no experience required"]

  seniority:
    title_penalties:          # first match only
      - keywords: ["iii", "iv", "3", "level 3", "level iii"]
        points: -25
      - keywords: ["ii", "2", "level 2", "level ii", "intermediate"]
        points: -10
    years_penalties:          # by minimum years the posting asks for
      - {min: 0, max: 1, points: 5}   # 2 years is neutral (no rule)
      - {min: 3, max: 3, points: -8}
      - {min: 4, max: 4, points: -25}
      - {min: 5, max: 5, points: -40}
  # Asking for this many years puts a job in tier D whatever its score
  tier_d_years: 5

  # Skills in title + description, weighted by how strong Jake's evidence is
  # (experience-vault/skills-map.md). Sum is capped.
  skills:
    have_cap: 60
    # "a|b" = synonyms, counted once
    # Extra points when a posting asks for all of these (his strongest pair)
    combos:
      - {skills: ["python", "sql"], points: 10}
    # Full posting names 3+ skills he has and none he lacks
    no_gaps_bonus: {points: 5, min_have_hits: 3}
    have:
      "sql": 15
      "bigquery": 10
      "python": 12
      "looker": 8
      "dashboard": 8
      "pandas": 6
      "scikit-learn|sklearn": 6
      "xgboost": 3
      "statistics|statistical": 5
      "machine learning": 5
      "data modeling|data modelling": 5
      "star schema": 3
      "data warehouse": 4
      "etl": 4
      "data quality": 4
      "churn": 3
      "survival analysis": 3
      "a/b test|a/b testing": 2
      "google sheets": 4
      "apps script": 3
      "pytorch": 3
      "deep learning": 2
      "llm|large language model": 3
      "nlp": 2
      "fastapi": 3
      "docker": 2
      "git": 2
      "jupyter": 2
      "numpy": 2
      "e-commerce|ecommerce": 3
      "shopify": 3
      "stakeholders": 2
      "data reporting": 4
      "kpi": 3
      "data visualization": 3
      "excel": 3
      "typescript": 2
      "react": 2
    gap_cap: 25
    # Another main language means a different stack (heavier). Data tools
    # are learnable on the job and often nice-to-haves (light).
    gaps:
      "c++": -6
      "java": -5
      "c#": -5
      ".net": -5
      "golang": -5
      "scala": -5
      "kubernetes": -3
      "spark|pyspark": -2
      "hadoop": -2
      "airflow": -2
      "databricks": -2
      "snowflake": -2
      "dbt": -2
      "kafka": -2
      "master's degree required": -6

  # Gaps read from the experience vault (src/vault_gaps.py). When the vault index
  # exists, this replaces skills.gaps above (kept as the fallback for a fresh clone).
  # A tool the posting asks for that no vault claim names costs `points`; a list
  # where one option is enough ("Tableau, Looker, or Power BI") counts once and any
  # tool in it covers it; text about the employer doesn't count; a tool asked for
  # only as a nice-to-have costs preferred_factor as much. Another main language
  # means a different stack, so it costs more (Jake's rule, PR #12).
  vault_gaps:
    index: materials/profile/vault-index.json
    points: -2
    preferred_factor: 0.5
    cap: 25
    heavier:
      "C/C++": -6
      "Java": -5
      "C#/.NET": -5
      "Go": -5
      "Scala": -5
      "Rust": -5
      "Kotlin/Swift": -5
      "Ruby": -5
      "Kubernetes": -3
    # Tools the vault shows only lightly: they halve a gap instead of closing it.
    # C/C++ (one systems course), Java (one course plus a small project), PowerShell
    # (0.9% of one repo), Salesforce (Trailhead badges).
    light: ["C/C++", "Java", "PowerShell", "Salesforce/CRM"]
    light_factor: 0.5

  location_points:
    vancouver: 5
    remote: 0

  short_description_chars: 300

  # Score bands → tier shown on the dashboard (first match wins)
  tiers:
    - {tier: "A", min: 60}
    - {tier: "B", min: 40}
    - {tier: "C", min: 20}
    - {tier: "D", min: -1000}

# ─── Tailoring pipeline (src/tailor, docs/tailoring-contract.md) ───────

tailor:
  # paths: {}            # override any of src/tailor/paths.py DEFAULT_PATHS
  daily_cap: 3           # application folders created per run
  tiers: [A, B]          # eligible tiers, in queue order
  min_description_chars: 1000
  gate:
    # A Jev answer fails when a 0-3 score is <= score_fail or a yes/no probability
    # is on the wrong side of yes_threshold. Failing or unanswered questions only
    # flag the job and move it to the bottom of its tier; they never drop it.
    score_fail: 1
    yes_threshold: 0.5
  evidence:
    # Jev also looks at every soft-skill requirement, since the taxonomy only finds lines using the
    # skill's own word and misses the stories that show it.
    jev_candidates: 15   # real bullets per requirement sent to Jev, by shared words (and as many again by soft skill)
    jev_generic_candidates: 2  # self-descriptions and skills-list lines also asked, per requirement
    jev_yes: 0.6         # probability at which Jev's "passage shows requirement" counts
    max_passages: 8      # strongest exact-match passages kept per term or requirement
  ats_weights: {keyword: 40, skills: 20, title: 15, sections: 15, dates: 10}
  synonym_credit: 0.5
  target_score: 80
  ats_floor: 70          # Jake's minimum: below it the loop keeps repairing and check.md flags it for review
  ats_soft_weight: 0.5   # soft skills (communication, teamwork...) count half as much as hard skills in the ATS score
  ats_wording_tolerance: 5   # within this many points of the best score the evidence allows counts as done
  stuffing_score: 90
  loop:
    max_rounds: 3        # drafts in total, so at most 2 repair rounds
    min_gain: 2.0
  similarity_revert: 0.45
  company_refresh_days: 30
  jev:
    model: typesafe-ai/jev
    base_url: https://ai-gateway.vercel.sh
    timeout_s: 30
    max_retries: 3
