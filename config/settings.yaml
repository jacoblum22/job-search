# Job Scraper Configuration

scraper:
  # Maximum number of jobs to scrape per run per source (0 = unlimited)
  max_jobs: 0

# ─── API job-board aggregators (Adzuna, CareerJet) ─────────────────
# Each keyword is run as a separate search query per API, per location.
# Credentials come from .env (see .env.example) — never put keys here.

api_sources:
  location: "Vancouver, BC"
  keywords:
    - "data scientist"
    - "data analyst"
    - "software engineer"
  results_per_page: 20
  adzuna:
    enabled: true
    country: "ca"  # Adzuna country code
  careerjet:
    enabled: true
    locale_code: "en_CA"
    referer: "http://jacoblum.com"  # must match the site registered on the publisher dashboard

# ─── Workday Sources ────────────────────────────────────────────────
# Each entry defines a Workday job board to scrape.
# The API pattern is: https://{tenant}.{wd}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs
#
# Set enabled: false to skip a source without removing it.

sources:
  - name: "UBC"
    tenant: "ubc"
    wd: "wd10"
    site: "ubcstaffjobs"
    enabled: true

  - name: "City of Vancouver"
    tenant: "cityofvancouver"
    wd: "wd5"
    site: "COV"
    enabled: true

  - name: "TRIUMF"
    tenant: "triumf"
    wd: "wd10"
    site: "careers-at-triumf-job-postings"
    enabled: true

  - name: "BCI"
    tenant: "bci"
    wd: "wd10"
    site: "BCI_Careers"
    enabled: false  # All jobs in Victoria — enable if they post Vancouver roles

  - name: "BCAA"
    tenant: "bcaa"
    wd: "wd3"
    site: "bcaacareers"
    enabled: true

  # ── New Vancouver-area sources (discovered via API probing) ──

  - name: "STEMCELL Technologies"
    tenant: "stemcell"
    wd: "wd3"
    site: "External_Careers"
    enabled: true
    location_filter:   # OR match — job passes if location contains ANY of these
      - "Vancouver"
      - "Burnaby"
      - "Greater Vancouver"

  - name: "Workday"
    tenant: "workday"
    wd: "wd5"
    site: "Workday"
    enabled: true
    location_filter: "Vancouver"  # ~411 total, ~7 in Vancouver

  - name: "RBC"
    tenant: "rbc"
    wd: "wd3"
    site: "RBCGLOBAL1"
    enabled: true
    location_filter:
      - "Vancouver"
      - "Burnaby"

  - name: "Shoppers Drug Mart"
    tenant: "myview"
    wd: "wd3"
    site: "sdm_careers"
    enabled: true
    location_filter:
      - "Vancouver"
      - "Burnaby"
      - "Richmond,"   # trailing comma to avoid matching "Richmond Hill, ON"
      - "New Westminster"

  - name: "CIBC"
    tenant: "cibc"
    wd: "wd3"
    site: "search"
    enabled: true
    location_filter:
      - "Vancouver"
      - "Burnaby"
      - "Richmond, BC"  # avoid Richmond Hill, ON

  - name: "BDO Canada"
    tenant: "bdo"
    wd: "wd3"
    site: "BDO"
    enabled: true
    location_filter: "Vancouver"

  # ── Disabled sources ──

  - name: "TELUS International"
    tenant: "telusinternational"
    wd: "wd3"
    site: "External"
    enabled: false  # Zero Vancouver jobs currently
    location_filter: "Vancouver"

  - name: "Salesforce"
    tenant: "salesforce"
    wd: "wd12"
    site: "External_Career_Site"
    enabled: false  # Zero Vancouver jobs currently
    location_filter: "Vancouver"

  - name: "Autodesk"
    tenant: "autodesk"
    wd: "wd1"
    site: "Ext"
    enabled: false  # ~600 jobs globally
    location_filter: "Vancouver"

  - name: "NVIDIA"
    tenant: "nvidia"
    wd: "wd5"
    site: "NVIDIAExternalCareerSite"
    enabled: false  # ~2000 jobs globally, zero in Canada
    location_filter: "Vancouver"

  - name: "Activision Blizzard"
    tenant: "activision"
    wd: "wd1"
    site: "External"
    enabled: false  # ~100 jobs globally
    location_filter: "Vancouver"

  - name: "Canadian Tire"
    tenant: "canadiantirecorporation"
    wd: "wd3"
    site: "Enterprise_External_Careers_Site"
    enabled: false  # ~4 Vancouver jobs
    location_filter: "Vancouver"

  - name: "TELUS Health"
    tenant: "lifeworks"
    wd: "wd3"
    site: "External"
    enabled: false  # Only 1 Vancouver job
    location_filter: "Vancouver"

  - name: "SCM / ClaimsPro"
    tenant: "scm"
    wd: "wd3"
    site: "SCM"
    enabled: false  # ~2 Vancouver-area jobs
    location_filter:
      - "Vancouver"
      - "New Westminster"

  - name: "Loblaw"
    tenant: "myview"
    wd: "wd3"
    site: "loblaw_careers"
    enabled: false  # ~1 job total

# ─── Tier Classification ────────────────────────────────────────────

tier:
  # Jobs requiring MORE than this many years experience → LOW tier
  experience_cutoff: 5

  # Location keywords that trigger LOW tier (too far from Vancouver to commute)
  low_location_keywords:
    - "Kelowna"
    - "Okanagan"
    - "Prince George"
    - "Victoria"
    - "Kamloops"
    - "Nanaimo"
    - "Coquitlam"
    - "Surrey"
    - "North Vancouver"

  # Minimum description keyword matches needed for HIGH tier
  high_description_min_matches: 2

  # Title keywords that trigger LOW tier (case-insensitive, word-boundary match)
  low_title_keywords:
    # Trades / maintenance
    - "Mechanical"
    - "Mechanic"
    - "Electrician"
    - "Plumber"
    - "Carpenter"
    - "HVAC"
    - "Millwright"
    - "Custodial"
    - "Janitorial"
    - "Trades"
    - "Refrigeration"
    # Non-software engineering (requires licensed P.Eng or specialized degree)
    - "Civil Engineer"
    - "Structural Engineer"
    - "Traffic Engineer"
    - "Electrical Engineer"
    - "Cryogenic Engineer"
    - "Construction Inspector"
    - "Wastewater"
    # Clinical / credentialed roles
    - "Physician"
    - "Nurse"
    - "Nursing"
    - "Pharmacist"
    - "Dentist"
    - "Veterinarian"
    - "Physiotherapist"
    - "Occupational Therapist"
    - "Physical Therapist"
    - "Medical Office"
    # Senior leadership (new grad filter)
    - "Senior Director"
    - "Sr. Director"
    - "Sr Director"
    - "Vice President"
    - "VP "
    - "Principal"
    - "Chief"
    - "Director of"
    # Academic faculty / postdoc (requires PhD)
    - "Professor"
    - "Postdoctoral"
    - "Postdoc"
    - "Post-Doc"
    - "Head Coach"
    # Manual labour
    - "Labourer"
    # Wrong-domain technical
    - "Animal Care"
    - "Cleanroom"
    # Specialized licensed professions
    - "CPA"
    - "Accountant"
    - "Lawyer"
    - "Barrister"
    - "Police Officer"
    - "Lifeguard"
    - "Swim Instructor"
    - "Fitness Instructor"
    - "Financial Planner"
    - "Insurance Advisor"
    - "Pharmacy Technician"

  # Job category keywords that trigger LOW tier
  low_category_keywords:
    - "Trades"
    - "Custodial"
    - "Facilities Maintenance"

  # Description keywords that trigger LOW tier (≥2 matches = wrong domain)
  # Catches wet-lab/bench-science "Research Assistant" roles
  low_description_keywords:
    - "molecular cloning"
    - "cloning of"
    - "cell culture"
    - "cell biology"
    - "wet lab"
    - "confocal microscopy"
    - "histology"
    - "Western Blot"
    - "PCR"
    - "protein purification"
    - "FPLC"
    - "SDS-PAGE"
    - "immunohistochemistry"
    - "immunofluorescence"
    - "nanoparticle"
    - "RNA synthesis"
    - "synthesizes RNA"
    - "mammalian cell"
    - "murine"
    - "tissue culture"
    - "gel electrophoresis"
    - "centrifugation"
    - "autoclave"
    - "biospecimen"
    - "necropsy"
    - "animal husbandry"
    - "laboratory animal"
    - "breeding colonies"
    - "growth chamber"
    - "plant transformation"
    - "greenhouse"
    - "bioengineering"
    - "immunology"
    - "RNA vaccine"
  low_description_min_matches: 2

  # Title keywords that trigger HIGH tier (case-insensitive, word-boundary match)
  # Focus: AI/ML, data, software development — matching your CogSys background
  high_title_keywords:
    # AI / ML / Data (primary fit)
    - "AI"
    - "ML"
    - "Machine Learning"
    - "Data Analyst"
    - "Data Scientist"
    - "Data Engineer"
    - "Data Science"
    - "Research Analyst"
    - "Research Assistant"
    - "Research Technician"
    # Software development (primary fit)
    - "Software Developer"
    - "Software Engineer"
    - "Programmer"
    - "Full Stack"
    - "Frontend"
    - "Backend"
    - "Web Developer"
    - "Web Designer"
    - "DevOps"
    - "QA"
    # Entry-level tech signals
    - "Junior Developer"
    - "Junior Software"
    - "Junior Programmer"
    - "Junior Analyst"
    - "Co-op"
    - "Intern"

  # Description keywords for HIGH tier (need ≥2 matches, word-boundary matching)
  # These catch generic titles like "Research Assistant" that involve your skills
  high_description_keywords:
    - "Python"
    - "JavaScript"
    - "TypeScript"
    - "machine learning"
    - "NLP"
    - "LLM"
    - "data analysis"
    - "REST API"
    - "React"
    - "Jupyter"
    - "SQL"
    - "software development"
    - "coding"
    - "artificial intelligence"
    - "deep learning"
    - "neural network"
    - "AWS"
    - "Azure"
    - "Docker"
    - "GitHub"
    - "version control"
    - "full stack"
    - "web development"
    - "data science"
    - "statistical analysis"
    - "R programming"

  # Title keywords that trigger MID-HIGH tier (B tier)
  # Good secondary fit: easy entry-level jobs you could pick up quickly
  midhigh_title_keywords:
    # Children / education / youth (camp counselor background)
    - "Child"
    - "Youth"
    - "Camp"
    - "Education"
    - "Teaching"
    - "Instructor"
    - "After-School"
    - "Daycare"
    - "Childcare"
    - "K-12"
    - "Early Learning"
    - "Student Support"
    - "Student Info"
    - "Tutor"
    # Retail / cashier / grocer
    - "Cashier"
    - "Grocer"
    - "Sales Attendant"
    - "Sales Associate"
    - "Sales Clerk"
    - "Retail"
    - "Store Associate"
    - "Merchandiser"
    # Front desk / reception / customer facing
    - "Receptionist"
    - "Front Counter"
    - "Front Desk"
    - "Admissions Desk"
    - "Patron Services"
    # Food service / hospitality
    - "Server"
    - "Waiter"
    - "Barista"
    - "Banquet"
    - "Catering"
    # General entry-level
    - "Attendant"
    - "Event Assistant"
    - "Clerk"
    - "Assistant"  # generic assistant roles
    # Tech-adjacent (not quite HIGH, but interesting)
    - "IT Support"
    - "Help Desk"
    - "Technical Support"
    - "Coordinator"

# ─── Output Paths ───────────────────────────────────────────────────

output:
  # Directory for job description .md files (relative to project root)
  job_descriptions_dir: "job_descriptions"

  # Directory for generated cover letters (relative to project root)
  cover_letters_dir: "cover_letters"

profile:
  # Path to resume (for reference in cover letter generation)
  resume: "profile/Jacob Andersen-Lum Resume.md"

  # Path to cover letter template
  cover_letter_template: "profile/Jacob Andersen-Lum Cover Letter Template.md"
