# Company job boards scraped by scripts/aggregate.py.
#
# workday: merged into settings.yaml `sources:` (tenant+site pairs already there
#   are skipped). Keep Vancouver-area words OUT of `name`: a source whose name
#   matches a Vancouver-area keyword keeps every posting, wherever it is.
# greenhouse / lever / ashby / smartrecruiters / workable: `slug` is the board id
#   in the public URL (boards.greenhouse.io/<slug>, jobs.lever.co/<slug>,
#   jobs.ashbyhq.com/<slug>, careers.smartrecruiters.com/<slug>,
#   apply.workable.com/<slug>). These feeds return the full posting; only
#   Vancouver-area and Canada-open remote jobs are kept.
# Add `enabled: false` to pause a board.

# Postings whose Workday location contains any of these (or reads as remote) are
# fetched; keep_job() then drops anything outside Metro Vancouver / remote.
bc_locations: &bc_locations
  - "Vancouver"
  - "Burnaby"
  - "Richmond, B"
  - "Surrey"
  - "Coquitlam"
  - "New Westminster"
  - "Langley"
  - "Delta, B"
  - "Port Moody"
  - "British Columbia"
  - ", BC"

