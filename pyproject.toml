[project]
name = "ubc-job-scraper"
version = "0.1.0"
description = "Automated scraper for UBC's Workday staff job board"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "python-slugify>=8.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "python-docx>=1.1",
]

[project.optional-dependencies]
pdf = ["pywin32>=306"]  # Windows-only COM automation for DOCX→PDF

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
